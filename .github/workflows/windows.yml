# Windows: clang-cl and MSVC with every backend and warnings as errors, then ctest: Direct3D 10 / 11 / 12 on WARP with
# their debug layers, Direct3D 9 on the runner's display adapter, OpenGL / GLES and Vulkan on Mesa's Windows build
# (llvmpipe opengl32.dll, lavapipe) with the Khronos validation layer of the Vulkan SDK. See docs/CI.md.
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_SDK_VERSION: 1.3.296.0
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-archives
  # D3D10 / 11 / 12 on WARP (the runners have no GPU), with the debug layer when the Graphics Tools are installed
  ESIA_D3D_DRIVER: warp
  ESIA_D3D_DEBUG: '1'
  # Mesa: llvmpipe for OpenGL (not the d3d12 Gallium driver, which would run GL on WARP)
  GALLIUM_DRIVER: llvmpipe

jobs:
  windows:
    name: ${{ matrix.preset }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-clang-cl
            build: windows-clang-cl
            test: windows-clang-cl
            bin: build/windows-clang-cl/bin
          - preset: windows-msvc
            build: windows-msvc-debug
            test: windows-msvc
            bin: build/windows-msvc/bin/Debug
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Toolchain
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          & {
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List
            Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterCompatibility | Format-List
            where.exe clang-cl lld-link cl ninja cmake
            clang-cl --version
            cmake --version
          } *>&1 | Tee-Object logs/toolchain.txt

      # ---- Direct3D debug layers: the "Graphics Tools" optional feature (d3d11sdklayers.dll, d3d12SDKLayers.dll).
      # Without it ESIA_D3D_DEBUG=1 falls back to no debug layer (logged by the backends).
      - name: Direct3D debug layers (Graphics Tools)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $cap = Get-WindowsCapability -Online -Name 'Tools.Graphics.DirectX~~~~0.0.1.0'
          "before: $($cap.State)" | Tee-Object -Append logs/graphics-tools.txt
          if ($cap.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name 'Tools.Graphics.DirectX~~~~0.0.1.0' *>&1 | Tee-Object -Append logs/graphics-tools.txt
          }
          $cap = Get-WindowsCapability -Online -Name 'Tools.Graphics.DirectX~~~~0.0.1.0'
          "after: $($cap.State)" | Tee-Object -Append logs/graphics-tools.txt
          Get-ChildItem "$env:WINDIR\System32" -Filter '*sdklayers*.dll' | Select-Object Name, Length | Tee-Object -Append logs/graphics-tools.txt

      # ---- Vulkan: headers, loader and the Khronos validation layer from the LunarG SDK (the installer is cached;
      # the installation itself runs every time)
      - name: Cache the Vulkan SDK installer
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vulkan-sdk-installer
          key: vulkan-sdk-installer-${{ env.VULKAN_SDK_VERSION }}

      - name: Vulkan SDK
        run: |
          $v = $env:VULKAN_SDK_VERSION
          $dir = "${{ runner.temp }}/vulkan-sdk-installer"
          $exe = "$dir/VulkanSDK-$v-Installer.exe"
          if (-not (Test-Path $exe)) {
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$v/windows/VulkanSDK-$v-Installer.exe" -OutFile $exe
          }
          $root = "C:/VulkanSDK/$v"
          & $exe --root $root --accept-licenses --default-answer --confirm-command install | Out-Host
          if (-not (Test-Path "$root/Include/vulkan/vulkan.h")) { throw "Vulkan SDK: $root/Include/vulkan/vulkan.h missing" }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          # the explicit layers of the SDK, whether or not the installer registered them
          "VK_ADD_LAYER_PATH=$root/Bin" >> $env:GITHUB_ENV
          # the loader: System32 when the installer put it there, else the SDK's copy
          $loader = Get-ChildItem -Recurse -Path $root -Filter vulkan-1.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          "loader in System32: $(Test-Path "$env:WINDIR/System32/vulkan-1.dll"); in the SDK: $($loader.FullName)" | Tee-Object logs/vulkan-sdk.txt
          if (-not (Test-Path "$env:WINDIR/System32/vulkan-1.dll") -and $loader) { $loader.DirectoryName >> $env:GITHUB_PATH }

      # ---- Mesa for Windows (pal1000/mesa-dist-win): llvmpipe's opengl32.dll next to the executables, lavapipe as
      # the Vulkan driver
      - name: Mesa for Windows (llvmpipe, lavapipe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "${{ runner.temp }}/mesa"
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release view --repo pal1000/mesa-dist-win --json tagName,name | Tee-Object logs/mesa.txt
          gh release download --repo pal1000/mesa-dist-win --pattern 'mesa3d-*-release-msvc.7z' --dir $dir
          $archive = Get-ChildItem $dir -Filter 'mesa3d-*-release-msvc.7z' | Select-Object -First 1
          $archive.Name | Tee-Object -Append logs/mesa.txt
          7z x -y "-o$dir/x" $archive.FullName | Out-Null
          Get-ChildItem "$dir/x/x64" | Select-Object Name, Length | Format-Table | Out-String | Tee-Object -Append logs/mesa.txt
          $icd = Get-ChildItem "$dir/x/x64" -Filter 'lvp_icd*.json' | Select-Object -First 1
          if ($icd) {
            "VK_DRIVER_FILES=$($icd.FullName)" >> $env:GITHUB_ENV
            "VK_ICD_FILENAMES=$($icd.FullName)" >> $env:GITHUB_ENV
          }
          "MESA_X64=$dir/x/x64" >> $env:GITHUB_ENV

      # ---- FreeType + HarfBuzz from the runner's vcpkg (binary packages cached, keyed by the vcpkg commit)
      - name: vcpkg commit
        id: vcpkg
        run: |
          "commit=$(git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force $env:VCPKG_BINARY_CACHE | Out-Null

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-x64-windows-freetype-harfbuzz-${{ steps.vcpkg.outputs.commit }}

      - name: FreeType + HarfBuzz (vcpkg)
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ env.VCPKG_BINARY_CACHE }},readwrite
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install freetype harfbuzz --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          $inst = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          "VCPKG_X64=$inst" >> $env:GITHUB_ENV
          "$inst/bin" >> $env:GITHUB_PATH

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -DESIA_WERROR=ON
          -DESIA_BACKEND_D3D9=ON -DESIA_BACKEND_D3D10=ON -DESIA_BACKEND_D3D11=ON -DESIA_BACKEND_D3D12=ON
          -DESIA_BACKEND_OPENGL=ON -DESIA_BACKEND_VULKAN=ON -DESIA_BACKEND_METAL=ON
          "-DCMAKE_PREFIX_PATH=${{ env.VCPKG_X64 }}"

      - name: Build
        run: cmake --build --preset ${{ matrix.build }}

      - name: Mesa's opengl32.dll next to the executables
        run: |
          foreach ($f in 'opengl32.dll', 'libgallium_wgl.dll', 'libglapi.dll') {
            if (Test-Path "$env:MESA_X64/$f") { Copy-Item "$env:MESA_X64/$f" "${{ matrix.bin }}/" }
          }
          Get-ChildItem "${{ matrix.bin }}" -Filter *.dll | Select-Object Name | Format-Table | Out-String | Tee-Object logs/bin-dlls.txt

      - name: Drivers (what the conformance suite runs on)
        run: |
          & "${{ matrix.bin }}/esia_conformance.exe" --list *>&1 | Tee-Object logs/drivers.txt
          if (Get-Command vulkaninfoSDK.exe -ErrorAction SilentlyContinue) { vulkaninfoSDK.exe --summary *>&1 | Tee-Object -Append logs/drivers.txt }
          elseif (Test-Path "$env:VULKAN_SDK/Bin/vulkaninfoSDK.exe") { & "$env:VULKAN_SDK/Bin/vulkaninfoSDK.exe" --summary *>&1 | Tee-Object -Append logs/drivers.txt }
          exit 0

      - name: Test
        run: >
          ctest --preset ${{ matrix.test }} --parallel 2 --timeout 1200
          --output-junit ctest-junit.xml --test-output-size-passed 65536 --test-output-size-failed 262144

      - name: Report
        if: ${{ !cancelled() }}
        run: >
          python .github/scripts/ctest_report.py build/${{ matrix.preset }}/ctest-junit.xml --title ${{ matrix.preset }}
          --require 'esia_conformance_(null|d3d10|d3d11|d3d12)(_frames)?'
          --require 'esia_rhi_d3d_(shader|device)_tests' --require 'esia_rhi_d3d1[012]_tests'

      - name: Upload conformance images and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            logs/
            build/${{ matrix.preset }}/conformance*/
            build/${{ matrix.preset }}/vulkan/
            build/${{ matrix.preset }}/text/
            build/${{ matrix.preset }}/ctest-junit.xml
            build/${{ matrix.preset }}/Testing/Temporary/
