# Backend branches: after every push to main, directx, opengl, vulkan and metal get a commit with main and that one
# backend - the core, its backend, the example frames and tests of the systems it runs on, its presets
# (tools/branches/backend_branches.py) - so a user clones the branch of their graphics API and builds it without
# choosing anything. Only appended to, never rewritten; a few seconds on a Linux runner.
name: Backend branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-branches   # one at a time, in push order: each commit goes on top of the last
  cancel-in-progress: false

jobs:
  branches:
    name: directx, opengl, vulkan, metal
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the branches' last commits, to build on
      # a push with GITHUB_TOKEN starts no workflow run: the branches run no CI of their own (main's covers them)
      - name: Regenerate the branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/branches/backend_branches.py --source HEAD --push
